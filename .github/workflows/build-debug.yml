name: Nagram XF Glass · Debug APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "NagramXF upstream branch, tag, or commit"
        required: true
        default: "dev"
        type: string
  push:
    branches: [main, dev, 'feature/**']
    paths:
      - ".github/workflows/build-debug.yml"
      - "patches/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: glass-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NagramXF Glass (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      UPSTREAM_REPO: Keeperorowner/NagramXF
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'dev' }}
      NATIVE_TARGET: arm64-v8a
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
      ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Glass configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate upstream ref
        shell: bash
        run: |
          if [[ ! "$UPSTREAM_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid upstream_ref"
            exit 1
          fi

      - name: Clone NagramXF and all submodules
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "$UPSTREAM_REF" \
            --recurse-submodules \
            --shallow-submodules \
            "https://github.com/$UPSTREAM_REPO.git" source

          echo "UPSTREAM_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify upstream source and Liquid Glass baseline
        run: bash scripts/verify-upstream.sh source

      - name: Set Glass application ID
        shell: bash
        run: |
          # Keep Glass installable beside the original NagramXF package.
          GLASS_APP_PACKAGE="fork.risin42.nagramx.glass"
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/gradle.properties")
          content = path.read_text()
          updated, count = re.subn(
              r"(?m)^APP_PACKAGE=.*$",
              "APP_PACKAGE=fork.risin42.nagramx.glass",
              content,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one APP_PACKAGE entry, found {count}")
          path.write_text(updated)
          print("Configured APP_PACKAGE=fork.risin42.nagramx.glass")
          PY

          # The upstream Firebase config is registered for the upstream package.
          # Adjust the local client package so the Google Services Gradle plugin
          # can generate resources; a dedicated Firebase app/config is still
          # recommended for production push/crash reporting.
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/TMessagesProj/google-services.json")
          if path.exists():
              data = json.loads(path.read_text())
              clients = data.get("client", [])
              if not clients:
                  raise SystemExit("google-services.json has no client entries")
              for client in clients:
                  client.setdefault("client_info", {}).setdefault(
                      "android_client_info", {}
                  )["package_name"] = "fork.risin42.nagramx.glass"
              path.write_text(json.dumps(data, indent=2) + "\\n")
              print("Adjusted local Google Services package name")
          else:
              print("No google-services.json present; skipping package adjustment")
          PY

      - name: Apply project patches
        shell: bash
        run: |
          shopt -s nullglob
          patches=(patches/*.patch)
          for patch_file in "${patches[@]}"; do
            echo "Applying $patch_file"
            git -C source apply --check "$GITHUB_WORKSPACE/$patch_file"
            git -C source apply "$GITHUB_WORKSPACE/$patch_file"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          if [[ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure Chaquopy host Python
        shell: bash
        run: |
          python --version
          python -m pip install --disable-pip-version-check Cython==3.0.11
          # Chaquopy invokes /usr/bin/python3 directly, so point that path
          # at the pinned 3.11 interpreter for this disposable CI runner.
          sudo ln -sf "$(command -v python)" /usr/bin/python3
          /usr/bin/python3 --version
          /usr/bin/python3 -c "import Cython; print('Cython', Cython.__version__)"

      - name: Configure Telegram credentials and signing
        shell: bash
        run: |
          app_id="${TELEGRAM_APP_ID:-6}"
          app_hash="${TELEGRAM_APP_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"

          if [[ -n "$SIGNING_KEYSTORE_BASE64" ]]; then
            if [[ -z "$KEYSTORE_PASS" || -z "$ALIAS_NAME" || -z "$ALIAS_PASS" ]]; then
              echo "::error::A persistent keystore also requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS."
              exit 1
            fi
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > source/TMessagesProj/release.keystore
          else
            echo "::warning::No persistent signing key configured; generating a temporary key for this run. Future APKs will not update-install over this build."
            KEYSTORE_PASS=android
            ALIAS_NAME=androidkey
            ALIAS_PASS=android
            # Upstream may ship a release.keystore with an unknown password.
            # Generate the temporary CI key from a clean path instead.
            rm -f source/TMessagesProj/release.keystore
            keytool -genkeypair -noprompt -v \
              -keystore source/TMessagesProj/release.keystore \
              -storetype JKS \
              -storepass "$KEYSTORE_PASS" \
              -alias "$ALIAS_NAME" \
              -keypass "$ALIAS_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NagramXF Glass Debug"
          fi

          test -s source/TMessagesProj/release.keystore

          cat > source/local.properties <<EOF
          TELEGRAM_APP_ID=$app_id
          TELEGRAM_APP_HASH=$app_hash
          KEYSTORE_PASS=$KEYSTORE_PASS
          ALIAS_NAME=$ALIAS_NAME
          ALIAS_PASS=$ALIAS_PASS
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Normal and Plugin Debug APKs
        working-directory: source
        env:
          BUILD_TIMESTAMP: ${{ github.run_id }}
          COMMIT_ID: ${{ env.UPSTREAM_SHA }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --parallel --max-workers=4 --stacktrace \
            :TMessagesProj:assembleNormalDebug \
            :TMessagesProj:assemblePluginDebug

      - name: Collect APKs and build metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find source/TMessagesProj/build/outputs/apk -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true

          {
            echo "Glass configuration commit: $GITHUB_SHA"
            echo "NagramXF upstream: $UPSTREAM_REPO"
            echo "NagramXF ref: $UPSTREAM_REF"
            echo "NagramXF commit: ${UPSTREAM_SHA:-not-cloned}"
            echo "Native ABI: $NATIVE_TARGET"
          } > "$GITHUB_WORKSPACE/output/BUILD-INFO.txt"

      - name: Upload debug APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NagramXF-Glass-debug-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
